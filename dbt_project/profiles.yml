data_warehouse_project:
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      user: "{{ env_var('POSTGRES_USER', 'data_warehouse') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'data_warehouse') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'data_warehouse_project') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10
  target: dev