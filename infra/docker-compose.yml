services:
  # Warehouse Postgres (existing)
  postgres:
    image: postgres:16
    container_name: dw_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-data_warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-data_warehouse_project}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${DATASETS_DIR_HOST:-../datasets}:/data/datasets:ro
      - ../scripts:/scripts:ro
      - ../legacy_sql:/legacy_sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_warehouse} -d ${POSTGRES_DB:-data_warehouse_project}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Airflow Metadata Database (separate from warehouse)
  airflow-metadata-db:
    image: postgres:16
    container_name: airflow_metadata_db
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: ${AIRFLOW_METADATA_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_METADATA_DB:-airflow}
    volumes:
      - airflow_metadata_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_METADATA_USER:-airflow} -d ${AIRFLOW_METADATA_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Airflow Init - runs migrations and creates admin user
  airflow-init:
    build:
      context: ..
      dockerfile: infra/airflow.Dockerfile
    container_name: airflow_init
    profiles: ["airflow"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_USER:-airflow}:${AIRFLOW_METADATA_PASSWORD:-airflow}@airflow-metadata-db:5432/${AIRFLOW_METADATA_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt_project:/opt/airflow/dbt_project:ro
      - ../scripts/bronze:/opt/airflow/scripts/bronze:ro
    depends_on:
      airflow-metadata-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Initialize Airflow database
        airflow db migrate
        # Create admin user
        airflow users create \
          --username "$$AIRFLOW_ADMIN_USER" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$$AIRFLOW_ADMIN_EMAIL"

  # Airflow Webserver
  airflow-webserver:
    build:
      context: ..
      dockerfile: infra/airflow.Dockerfile
    container_name: airflow_webserver
    profiles: ["airflow"]
    restart: unless-stopped
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_USER:-airflow}:${AIRFLOW_METADATA_PASSWORD:-airflow}@airflow-metadata-db:5432/${AIRFLOW_METADATA_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # dbt environment variables for connecting to warehouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-data_warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-data_warehouse_project}
      # dbt log path - use /tmp which is always writable
      DBT_LOG_PATH: /tmp/dbt_logs
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt_project:/opt/airflow/dbt_project:ro
      - ../scripts/bronze:/opt/airflow/scripts/bronze:ro
      # Writable directory for dbt target (profiles.yml writes to target/)
      - airflow_dbt_target:/opt/airflow/dbt_project/target
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/airflow.Dockerfile
    container_name: airflow_scheduler
    profiles: ["airflow"]
    restart: unless-stopped
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_USER:-airflow}:${AIRFLOW_METADATA_PASSWORD:-airflow}@airflow-metadata-db:5432/${AIRFLOW_METADATA_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-}
      # dbt environment variables for connecting to warehouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-data_warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-data_warehouse_project}
      # dbt log path - use /tmp which is always writable
      DBT_LOG_PATH: /tmp/dbt_logs
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../dbt_project:/opt/airflow/dbt_project:ro
      - ../scripts/bronze:/opt/airflow/scripts/bronze:ro
      # Writable directory for dbt target (profiles.yml writes to target/)
      - airflow_dbt_target:/opt/airflow/dbt_project/target
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_metadata_db_data:
  airflow_dbt_target: